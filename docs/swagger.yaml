  go-enterprise-api_internal_interface_httpapi.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorBody'
    type: object
  internal_interface_http_handler.assignPermissionRequest:
    properties:
      permission_id:
