    type: object
  internal_interface_http_handler.updateGatewayAPIRequest:
    properties:
      base_path:
        type: string
      is_active:
        type: boolean
      methods:
        items:
          type: string
        type: array
      name:
        type: string
      note:
        type: string
      rate_limit_rpm:
        type: integer
      requires_auth:
        type: boolean
      upstream:
        type: string
    type: object
  internal_interface_http_handler.updateUserRequest:
    properties:
      name:
        type: string
      status:
        type: string
    type: object
host: localhost:18080
info:
  contact:
    name: GitOps
  description: 'Enterprise boilerplate: Dynamic Rate Limit, Soft Delete, Audit Logs,
    RBAC, JWT + Redis sessions, Microsoft Entra (OIDC). All requests pass through
    the Nginx gateway (X-Gateway-Token handshake) — public endpoints are also rate-limited
    per IP at the gateway.'
  title: Go Enterprise API
  version: "1.0"
paths:
  /api/v1/audit-logs:
    get:
      description: 'Paginated, filterable trail of WHO/WHAT/DATA/WHEN/FROM. Filters:
        user_id, action, resource, resource_id, request_id.'
      parameters:
      - description: Filter by user
        in: query
        name: user_id
        type: integer
      - description: Filter by action (LOGIN, USER_CREATED, …)
        in: query
        name: action
        type: string
      - description: Filter by resource (users, roles, …)
        in: query
        name: resource
        type: string
      - description: Filter by resource id
        in: query
        name: resource_id
        type: string
      - description: Filter by request id
        in: query
        name: request_id
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/go-enterprise-api_internal_domain_audit.Entry'
            type: array
      security:
      - BearerAuth: []
      summary: Search audit logs
      tags:
      - audit
    post:
      consumes:
      - application/json
      description: Records a raw audit entry. The authenticated principal, request
        id, method and path are attached automatically.
      parameters:
      - description: Audit entry
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/go-enterprise-api_internal_domain_audit.Entry'
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Write a manual audit entry
      tags:
      - audit
  /api/v1/auth/entra/callback:
    get:
      description: Exchanges the authorization code for a verified profile, JIT-provisions
        the user with the default role and issues a session. Returns the standard
        LoginResult JSON (or a fragment redirect when OAUTH_FRONTEND_URL is set).
      parameters:
      - description: Authorization code from Microsoft
        in: query
        name: code
        required: true
        type: string
      - description: CSRF state returned from /entra/login
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_application_auth.LoginResult'
        "400":
          description: missing/invalid code or state
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "502":
          description: exchange with Microsoft failed
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      summary: Entra OIDC callback
      tags:
      - auth
  /api/v1/auth/entra/login:
    get:
      description: Issues a CSRF state and 302-redirects the browser to Microsoft.
        Unconfigured when OAUTH_CLIENT_ID/OAUTH_TENANT_ID are empty → 503 so the SPA
        can fall back to the local form.
      responses:
        "302":
          description: Redirect to login.microsoftonline.com
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      summary: Start Microsoft Entra (OIDC) login
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates with the local provider and returns a JWT access
        token. Route-limited by the dynamic rule POST:/api/v1/auth/login (10 req/min
        by default).
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_interface_http_handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_application_auth.LoginResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      summary: Login with email/password
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Revokes the Redis session, invalidating the JWT immediately.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout / revoke session
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user with their effective roles.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user profile
      tags:
      - auth
  /api/v1/gateway/apis:
    get:
      description: Returns all registered APIs managed by the gateway console, with
        live health status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/go-enterprise-api_internal_domain_gatewayapi.GatewayAPI'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List registered gateway APIs
      tags:
      - gateway
    post:
      consumes:
      - application/json
      description: Registers an upstream API and publishes it to the gateway (nginx
        include + hot reload) immediately. base_path must be a single segment like
        /orders; upstream is the origin url. Methods default to GET, rate_limit_rpm
        to 60, requires_auth to true.
      parameters:
      - description: API to register
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_interface_http_handler.createGatewayAPIRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_domain_gatewayapi.GatewayAPI'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "409":
          description: base path already in use
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a gateway API
      tags:
      - gateway
  /api/v1/gateway/apis/{id}:
    delete:
      description: Removes the API from the gateway (generated nginx config is dropped).
      parameters:
      - description: Gateway API ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft delete a registered gateway API
      tags:
      - gateway
    get:
      parameters:
      - description: Gateway API ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_domain_gatewayapi.GatewayAPI'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get one registered gateway API
      tags:
      - gateway
    put:
      consumes:
      - application/json
      description: Updates fields and re-publishes the gateway config. Audited (old
        → new data).
      parameters:
      - description: Gateway API ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_interface_http_handler.updateGatewayAPIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_domain_gatewayapi.GatewayAPI'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a registered gateway API
      tags:
      - gateway
  /api/v1/gateway/apis/{id}/preview:
    get:
      description: Simulates the exact nginx location block the gateway would apply.
      parameters:
      - description: Gateway API ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/plain
      responses:
        "200":
          description: generated nginx snippet
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Preview generated nginx config (no publish)
      tags:
      - gateway
  /api/v1/gateway/apis/{id}/restore:
    post:
      description: Re-registers the API and re-publishes the gateway config.
      parameters:
      - description: Gateway API ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore a soft-deleted gateway API
      tags:
      - gateway
  /api/v1/gateway/apis/{id}/stats:
    get:
      description: Today's totals (Redis) plus the most recent proxied requests (in-memory
        ring) for one registered API.
      parameters:
      - description: Gateway API ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_interface_http_handler.gatewayStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Gateway API statistics
      tags:
      - gateway
  /api/v1/gateway/publish:
    post:
      description: Regenerates every nginx include and triggers the gateway hot-reload.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Re-publish the full registry to the gateway
      tags:
      - gateway
  /api/v1/permissions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/go-enterprise-api_internal_domain_permission.Permission'
            type: array
      security:
      - BearerAuth: []
      summary: List permissions
      tags:
      - permissions
    post:
      consumes:
      - application/json
      parameters:
      - description: Permission
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_interface_http_handler.permissionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_domain_permission.Permission'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create permission
      tags:
      - permissions
  /api/v1/permissions/{id}:
    delete:
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft delete permission
      tags:
      - permissions
    put:
      consumes:
      - application/json
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      - description: Permission
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_interface_http_handler.permissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_domain_permission.Permission'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update permission
      tags:
      - permissions
  /api/v1/permissions/{id}/restore:
    post:
      parameters:
      - description: Permission ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore soft-deleted permission
      tags:
      - permissions
  /api/v1/rate-limits:
    get:
      description: Dynamic rules stored in PostgreSQL. Changes apply live within the
        Redis cache TTL (30s).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/go-enterprise-api_internal_domain_ratelimit.Rule'
            type: array
      security:
      - BearerAuth: []
      summary: List rate limit rules
      tags:
      - rate-limits
    post:
      consumes:
      - application/json
      parameters:
      - description: Rule
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_interface_http_handler.ruleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_domain_ratelimit.Rule'
      security:
      - BearerAuth: []
      summary: Create rate limit rule
      tags:
      - rate-limits
  /api/v1/rate-limits/{id}:
    delete:
      description: Disables the rule.
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-enterprise-api_internal_interface_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Soft delete rate limit rule
      tags:
      - rate-limits
    put:
