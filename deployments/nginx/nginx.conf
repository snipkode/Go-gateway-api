worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Hardening & basics ──────────────────────────────────────────────
    server_tokens        off;
    default_type         application/octet-stream;
    client_max_body_size 1m;
    sendfile             on;
    keepalive_timeout    30s;
    include              /etc/nginx/mime.types;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Upstream (Go API, internal docker network only) ────────────────
    # The `upstream go_api` block lives in /etc/nginx/upstream.conf,
    # written by the entrypoint with APP_UPSTREAM_API (compose: api:8080,
    # Kubernetes same-pod: 127.0.0.1:8080).
    include /etc/nginx/upstream.conf;

    # ── Rate limit zones (per client IP) ────────────────────────────────
    # Public endpoints are guarded here (defense in depth: the app also
    # enforces its own dynamic rules from rate_limit_rules in Redis).
    limit_req_zone  $binary_remote_addr zone=zone_login:10m rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=zone_api:10m rate=200r/m;
    limit_req_zone  $binary_remote_addr zone=zone_auth:10m rate=50r/m;
    limit_req_status 429;

    # ── Malicious user agents (scanners / attack tools) ────────────────
    map $http_user_agent $is_bad_agent {
        default                                0;
        ~*(sqlmap|nikto|nessus|acunetix|fimap|havij|hydra|sqlthing)
                                            1;
        ~*(python-requests|go-http-client|java-http|libwww-perl)
                                            1;
        ~*dirbuster|wpscan|whatweb|zmap|masscan
                                            1;
    }

# ── Suspicious request patterns (SQLi / XSS / path traversal) ──────
    # Heuristic WAF: catches raw and %-encoded payloads (space=%20/%09/+).
    map $request_uri $is_suspicious {
        default 0;
        ~*union(\s|%20|%09|%2b|\+)+select    1;
        ~*sleep(\s|%20|%09|%2b|\+)*\(|sleep%28
                                             1;
        ~*concat%28|concat\(                 1;
        ~*\binto(\s|%20|%09|%2b|\+)+outfile  1;
        ~*(<script|onerror\s*=|javascript:)/(admin|wp-login|\.env|\.git)/
                                             1;
        ~*(%00|\.\./\.\./\.\.|/etc/passwd)   1;
    }

    # ── Request ID variability (falls back to nginx built-in $request_id) ─
    map $http_x_request_id $gateway_request_id {
        default $request_id;
        "~^.{1,100}$" $http_x_request_id;
    }

    log_format gateway '$remote_addr - [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       'rid=$gateway_request_id rt=$request_time '
                       '"$http_user_agent"';

    # Per-registered-API access log consumed by the Go API monitoring
    # aggregator (JSONL on the shared registry volume).
    log_format gateway_json escape=json
        '{"time":"$time_iso8601","ip":"$remote_addr","status":$status,'
        '"method":"$request_method","uri":"$request_uri","bytes":$body_bytes_sent,'
        '"upstream":"$upstream_addr","rt":$request_time,"ua":"$http_user_agent"}';

    access_log /var/log/nginx/access.log gateway;
    error_log  /var/log/nginx/error.log warn;

    # ── Registered-API registry (http level: rate-limit zones) ──────────
    # Written by the Go API gateway registry; hot-reloaded on change.
    include /etc/nginx/registry/zones.conf;

    # ── Server ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        resolver 127.0.0.11 valid=10s ipv6=off; # docker DNS

        # ── Security headers (every response) ──────────────────────────
        add_header X-Content-Type-Options    "nosniff"                 always;
        add_header X-Frame-Options           "SAMEORIGIN"              always;
        add_header X-XSS-Protection          "1; mode=block"           always;
        add_header Referrer-Policy           "no-referrer"             always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # ── Shared-secret handshake with the API (injected by entrypoint) ─
        include /etc/nginx/conf.d/gateway-token.conf;

        location = /healthz {
            access_log off;
            proxy_pass http://go_api;
        }

        location = /readyz {
            access_log off;
            proxy_pass http://go_api;
        }

        # Public & sensitive route → strict per-IP limit at the gateway.
        location = /api/v1/auth/login {
            limit_req zone=zone_login burst=5 nodelay;
            proxy_pass http://go_api;
        }

        # Public OIDC/OAuth redirect endpoints → moderate limit.
        location /api/v1/auth/entra/ {
            limit_req zone=zone_auth burst=10 nodelay;
            proxy_pass http://go_api;
        }

        # OpenAPI documentation (swagger-ui). Enable in dev only.
        location /swagger/ {
            limit_req zone=zone_api burst=10 nodelay;
            proxy_pass http://go_api;
        }

        # Everything else under /api/ → general per-IP limit.
        location /api/ {
            limit_req zone=zone_api burst=50 nodelay;
            proxy_pass http://go_api;
        }

        # Optional Vue.js static frontend. Mount your built dist to
        # /usr/share/nginx/html (SPA fallback to index.html).
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
        location = /favicon.ico { return 204; }

        # ── API Gateway Management Console (Vue 3 SPA) ──────────────────
        # Built dist mounted at /usr/share/nginx/html (see docker-compose).
        location /admin/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /admin/index.html;
        }
        location = /admin {
            return 301 /admin/;
        }

        # ── Registered-API registry (location level, written by the API) ─
        include /etc/nginx/registry/locations/*.conf;

        # ── Gateway-level request filtering (runs before proxying) ─────
        set $gateway_deny 0;

        if ($is_bad_agent)        { set $gateway_deny 1; }
        if ($is_suspicious)       { set $gateway_deny 1; }

        location ~ \.php$ {
            return 403;
        }

        if ($gateway_deny = 1) {
            return 403;
        }

        # ── Shared proxy settings for every proxied location ───────────
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $gateway_request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # ── Custom error payloads (keep the same shape as the API) ─────
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"error":{"code":"rate_limited","message":"too many requests"}}';
        }

        error_page 403 = @denied;
        location @denied {
            default_type application/json;
            return 403 '{"error":{"code":"forbidden","message":"request denied by gateway"}}';
        }
    }
}